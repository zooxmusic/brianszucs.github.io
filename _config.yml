# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.




title: All Things Brian Szucs
email: brian@zooxmusic.com
description: >- # this means to ignore newlines until "baseurl:"
 Seasoned Full Stack Java Developer with over 26 years of experience in Java 4 to 24, Staunch believer in true Test Driven Development (TDD),  
 Domain Driven Design, AI, ML, OOP/OOD, Spring Boot, React.js, AWS, and Microservices architecture. 
 Proven track record in designing scalable, high-performance applications with a deep focus on API design, cloud infrastructure, 
 Swagger documentation, and data modeling. Passionate about Agile, TDD, mentoring, and delivering elegant, maintainable software systems.

baseurl: "" # the subpath of your site, e.g. /blog
url: "http://brianszucs.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: zooxmusic
github_username:  zooxmusic


# Build settings
theme: jekyll-theme-modernist

plugins:
  - jekyll-feed


gem 'jekyll-admin', group: :jekyll_plugins 

#gem "github-pages", group: :jekyll_plugins

defaults:
  - scope:
      path: "assets/img"
    values:
      image: true

collections:
  articles:
    output: true
    permalink: /articles/:name/
    


